services:
  flutter-app:
    build: ./flutter_app
    ports:
      - "3000:80"
    depends_on:
      - gateway

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-for-diploma}
      AUTH_SERVICE_URL: http://auth-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      PORT: 8080
    depends_on:
      - auth-service
      - catalog-service
      - order-service

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_DATABASE: sushi_auth_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-for-diploma}
      PORT: 8081
    depends_on:
      auth-db:
        condition: service_healthy

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sushi_auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-service:
    build: ./catalog-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: catalog-db
      DB_PORT: 5432
      DB_DATABASE: sushi_catalog_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PORT: 8082
    depends_on:
      catalog-db:
        condition: service_healthy

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sushi_catalog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-service:
    build: ./order-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: order-db
      DB_PORT: 5432
      DB_DATABASE: sushi_order_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CATALOG_SERVICE_URL: http://catalog-service:8082
      PORT: 8083
    depends_on:
      order-db:
        condition: service_healthy
      catalog-service:
        condition: service_started

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sushi_order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  auth-db-data:
  catalog-db-data:
  order-db-data:
